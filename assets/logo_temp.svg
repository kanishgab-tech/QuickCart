<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
    <defs>
        <!-- Import a stylish, elegant serif font from Google Fonts -->
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&amp;display=swap');
            
            .brand-text {
                font-family: 'Playfair Display', Georgia, serif;
                font-size: 52px;
                font-weight: 600;
                fill: #4A2E1B; /* Deep rich cracker/wheat brown */
                letter-spacing: 2px;
            }
            
            .sub-text {
                font-family: 'Playfair Display', Georgia, serif;
                font-size: 24px;
                font-style: italic;
                fill: #C78241; /* Warm golden-brown accent */
                letter-spacing: 4px;
            }
            
            .decorative-line {
                stroke: #D9A05B;
                stroke-width: 2;
                stroke-dasharray: 4 4; /* Dotted effect resembling cracker holes */
            }
        </style>
        
        <!-- Subtle shadow for a premium feel -->
        <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#4A2E1B" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- Optional Soft Background Layer -->
    <rect width="100%" height="100%" fill="#FDFBF7" rx="15"/>

    <g filter="url(#subtle-shadow)">
        <!-- Top Decorative Dotted Line -->
        <line x1="80" y1="50" x2="520" y2="50" class="decorative-line" />

        <!-- Main Brand Text -->
        <text x="300" y="110" text-anchor="middle" class="brand-text">KANSAN</text>
        
        <!-- Sub Text -->
        <text x="300" y="145" text-anchor="middle" class="sub-text">crackers</text>

        <!-- Bottom Decorative Dotted Line -->
        <line x1="180" y1="165" x2="420" y2="165" class="decorative-line" />
    </g>
</svg>
